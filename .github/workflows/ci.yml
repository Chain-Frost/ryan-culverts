name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Preserve every main push for exact-SHA release finalization.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Check GitHub Actions workflows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_windows_amd64.zip' --dir $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $directory 'actionlint_1.7.12_windows_amd64.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '6E7241B51E6817EA6A047693D8E6FED13B31819C9A0DD6C5A726E1592D22F6E9') {
            throw 'Actionlint archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          & (Join-Path $directory 'actionlint.exe') -ignore 'unexpected key "queue" for "concurrency" section'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e .[dev]
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint check
        shell: pwsh
        run: python -m ruff check .

      - name: Format check
        shell: pwsh
        run: python -m ruff format --check .

      - name: Type check
        shell: pwsh
        run: python -m pyright

      - name: Test
        shell: pwsh
        run: python -m pytest --durations=10

      - name: Check Markdown
        shell: pwsh
        run: python -m pymarkdown -d MD013 scan -r README.md docs

      - name: Build documentation strictly
        shell: pwsh
        run: python -m mkdocs build --strict

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Build and verify fresh wheel
        shell: pwsh
        run: |
          python scripts/build_package.py --no-bump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  installed-wheel:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --outdir wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and smoke-test wheel outside the source tree
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath wheelhouse -Filter ryan_culverts-*.whl -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one project wheel." }
          python -m pip install $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/scripts/smoke_test_installed_wheel.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Build and smoke-test vendored wheel outside the source tree
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "vendored-fixture"
          $wheelhouse = Join-Path $env:RUNNER_TEMP "vendored-wheelhouse"
          $target = Join-Path $env:RUNNER_TEMP "vendored-install"
          New-Item -ItemType Directory -Force -Path "$fixture/src", $wheelhouse, $target | Out-Null
          Copy-Item -LiteralPath "tests/packaging_fixtures/vendored/pyproject.toml" -Destination $fixture
          Copy-Item -LiteralPath "src/culvert_solver" -Destination "$fixture/src" -Recurse
          python -m build --wheel --outdir $wheelhouse $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem -LiteralPath $wheelhouse -Filter *.whl -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one vendored fixture wheel." }
          python -m pip install --target $target $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $staleMetadata = Join-Path $target "ryan_culverts-1.2.3.dist-info"
          New-Item -ItemType Directory -Path $staleMetadata | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $staleMetadata "METADATA"),
            "Metadata-Version: 2.4`nName: ryan-culverts`nVersion: 1.2.3`n",
            [Text.UTF8Encoding]::new($false)
          )
          $expectedVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/scripts/smoke_test_vendored_wheel.py" `
              --expected-root $target `
              --expected-version $expectedVersion `
              --unrelated-version 1.2.3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
